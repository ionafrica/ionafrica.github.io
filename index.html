<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IonAfrica – Flags & Stories</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#fdf6ec;color:#222}
    header{background:linear-gradient(90deg,#00853f,#fcd116,#e8112d);color:#fff;text-align:center;padding:32px}
    h1{margin:0 0 8px;font-size:28px}
    .search{display:flex;justify-content:center;gap:8px;margin:16px}
    .search input{padding:10px 12px;border-radius:8px;border:1px solid #ccc;width:240px}
    .btn{padding:12px 18px;border:1px solid #333;border-radius:12px;text-decoration:none;color:#111;background:#fff}
    .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));max-width:900px;margin:0 auto}
    .card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;text-align:center}
    .flag{font-size:40px}
    footer{text-align:center;margin:32px;color:#666}
  </style>
</head>
<body>
  <header>
    <h1>IonAfrica is live 🌍</h1>
    <p>Discover Africa’s flags & stories — bilingual (EN/FR) coming next.</p>
  </header>

  <div class="search">
    <input id="search" type="text" placeholder="Search a country…" />
    <a href="#" class="btn" id="donateBtn">Donate</a>
  </div>

  <main>
    <div id="grid" class="grid"></div>
  </main>

  <footer>© IonAfrica Foundation</footer>

  <script>
    // 👉 If you have your PayPal link, paste it here between the quotes:
    const PAYPAL_LINK = "";

    const countries=[{n:"Senegal",f:"🇸🇳"},{n:"Kenya",f:"🇰🇪"},{n:"Ghana",f:"🇬🇭"},{n:"Morocco",f:"🇲🇦"},{n:"South Africa",f:"🇿🇦"}];

    const grid=document.getElementById('grid');
    function render(list){
      grid.innerHTML='';
      list.forEach(c=>{
        const div=document.createElement('div');
        div.className='card';
        div.innerHTML=`<div class="flag">${c.f}</div><div>${c.n}</div>`;
        grid.appendChild(div);
      });
    }
    render(countries);

    document.getElementById('search').addEventListener('input',e=>{
      const q=e.target.value.toLowerCase();
      render(countries.filter(c=>c.n.toLowerCase().includes(q)));
    });

    document.getElementById('donateBtn').addEventListener('click',e=>{
      e.preventDefault();
      if(PAYPAL_LINK){
        window.open(PAYPAL_LINK,'_blank');
      }else{
        alert('PayPal link not set yet. Add it later!');
      }
    });
  </script>
</body>
</html>
