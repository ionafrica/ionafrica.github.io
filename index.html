<script>
  // 1) Put your PayPal link here when you have it.
  // Example PayPal.Me: "https://www.paypal.me/IonAfrica"
  // Example Hosted Donate Button: "https://www.paypal.com/donate/?hosted_button_id=YOUR_ID"
  const PAYPAL_LINK = ""; // leave blank to use QR fallback

  // 2) Flags list
  const countries=[{n:"Algeria",f:"🇩🇿"},{n:"Angola",f:"🇦🇴"},{n:"Benin",f:"🇧🇯"},{n:"Botswana",f:"🇧🇼"},
  {n:"Burkina Faso",f:"🇧🇫"},{n:"Burundi",f:"🇧🇮"},{n:"Cabo Verde",f:"🇨🇻"},
  {n:"Cameroon",f:"🇨🇲"},{n:"Central African Republic",f:"🇨🇫"},{n:"Chad",f:"🇹🇩"},
  {n:"Comoros",f:"🇰🇲"},{n:"Congo (Republic)",f:"🇨🇬"},{n:"Congo (DRC)",f:"🇨🇩"},
  {n:"Côte d’Ivoire",f:"🇨🇮"},{n:"Djibouti",f:"🇩🇯"},{n:"Egypt",f:"🇪🇬"},
  {n:"Equatorial Guinea",f:"🇬🇶"},{n:"Eritrea",f:"🇪🇷"},{n:"Eswatini",f:"🇸🇿"},
  {n:"Ethiopia",f:"🇪🇹"},{n:"Gabon",f:"🇬🇦"},{n:"Gambia",f:"🇬🇲"},
  {n:"Ghana",f:"🇬🇭"},{n:"Guinea",f:"🇬🇳"},{n:"Guinea-Bissau",f:"🇬🇼"},
  {n:"Kenya",f:"🇰🇪"},{n:"Lesotho",f:"🇱🇸"},{n:"Liberia",f:"🇱🇷"},
  {n:"Libya",f:"🇱🇾"},{n:"Madagascar",f:"🇲🇬"},{n:"Malawi",f:"🇲🇼"},
  {n:"Mali",f:"🇲🇱"},{n:"Mauritania",f:"🇲🇷"},{n:"Mauritius",f:"🇲🇺"},
  {n:"Morocco",f:"🇲🇦"},{n:"Mozambique",f:"🇲🇿"},{n:"Namibia",f:"🇳🇦"},
  {n:"Niger",f:"🇳🇪"},{n:"Nigeria",f:"🇳🇬"},{n:"Rwanda",f:"🇷🇼"},
  {n:"São Tomé and Príncipe",f:"🇸🇹"},{n:"Senegal",f:"🇸🇳"},{n:"Seychelles",f:"🇸🇨"},
  {n:"Sierra Leone",f:"🇸🇱"},{n:"Somalia",f:"🇸🇴"},{n:"South Africa",f:"🇿🇦"},
  {n:"South Sudan",f:"🇸🇸"},{n:"Sudan",f:"🇸🇩"},{n:"Tanzania",f:"🇹🇿"},
  {n:"Togo",f:"🇹🇬"},{n:"Tunisia",f:"🇹🇳"},{n:"Uganda",f:"🇺🇬"},
  {n:"Zambia",f:"🇿🇲"},{n:"Zimbabwe",f:"🇿🇼"}];

  // Only link to pages that exist. Right now, just Senegal.
  const available = new Set(['senegal']);

  const grid=document.getElementById('grid');
  const searchInput=document.getElementById('search');

  function slugify(name){
    return name.toLowerCase()
      .replaceAll(/[\u2019'’]/g,'')
      .replaceAll(/[^a-z0-9]+/g,'-')
      .replace(/(^-|-$)/g,'');
  }

  function render(list){
    grid.innerHTML='';
    list.forEach(c=>{
      const slug=slugify(c.n);
      const card=document.createElement('a');
      card.className='card';
      card.innerHTML=`<span class="flag">${c.f}</span><div class="name">${c.n}</div>`;
      if(available.has(slug)){
        card.href=`countries/${slug}.html`;
      }else{
        card.href='#';
        card.addEventListener('click',e=>{
          e.preventDefault();
          alert(c.n + " page is coming soon.");
        });
      }
      grid.appendChild(card);
    });
  }
  render(countries);

  searchInput.addEventListener('input',e=>{
    const q=e.target.value.trim().toLowerCase();
    render(countries.filter(c=>c.n.toLowerCase().includes(q)));
  });

  // Donate button: PayPal link if set, else open QR image (paypal-qr.jpg) in a new tab
  const donateBtn=document.getElementById('donateBtn');
  donateBtn.addEventListener('click',e=>{
    e.preventDefault();
    if(PAYPAL_LINK){
      // If it's a PayPal.Me link, optionally prompt for amount
      if(/paypal\.me/i.test(PAYPAL_LINK)){
        const amt=prompt("Enter donation amount (USD):","25");
        const url=(amt && !isNaN(amt)) ? `${PAYPAL_LINK}/${amt}` : PAYPAL_LINK;
        window.open(url,'_blank','noopener');
      }else{
        window.open(PAYPAL_LINK,'_blank','noopener');
      }
    }else{
      window.open('paypal-qr.jpg','_blank','noopener'); // fallback to QR image
    }
  });
</script>
